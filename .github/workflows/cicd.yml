name: CICD Pipeline 

on:
  push:
    branches: [ "main" ]

# Repo mein changes push karne ke liye permissions
permissions:
  contents: write

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn compile

  security-check:
    runs-on: self-hosted
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Install Security Tools (Trivy & Gitleaks)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy gitleaks
      - name: Trivy FS Scan
        run: trivy fs --format table -o fs-report.json .
      - name: Gitleaks Code Scan
        run: gitleaks detect source . -r gitleaks-report.json -f json || echo "Secrets found or scan failed"

  test:
    runs-on: self-hosted
    needs: security-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Unit Test Cases
        run: mvn test

  build_project_and_sonar_scanner:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Project
        run: mvn package
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    runs-on: self-hosted
    needs: build_project_and_sonar_scanner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/bankapp:${{ github.run_id }} .
          docker push ${{ secrets.DOCKER_USER }}/bankapp:${{ github.run_id }}
          docker tag ${{ secrets.DOCKER_USER }}/bankapp:${{ github.run_id }} ${{ secrets.DOCKER_USER }}/bankapp:latest
          docker push ${{ secrets.DOCKER_USER }}/bankapp:latest

      - name: Update Manifest for ArgoCD (GitOps)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # ds.yml mein image tag update karna
          sed -i "s|image: ${{ secrets.DOCKER_USER }}/bankapp:.*|image: ${{ secrets.DOCKER_USER }}/bankapp:${{ github.run_id }}|g" ds.yml
          git add ds.yml
          git commit -m "chore: update image tag to ${{ github.run_id }} [skip ci]"
          git push
